services:
  - type: web
    name: crypto-alt-alert-bot
    env: python
    plan: starter
    region: singapore  # Binance blocks all US-region IPs (451 error) - Oregon/Ohio/Virginia
                        # will never work for this app. Singapore is closest to India too.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DRY_RUN
        value: "false"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
